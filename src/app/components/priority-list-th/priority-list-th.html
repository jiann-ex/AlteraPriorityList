<div class="flex justify-between items-center w-full">
  <div [ariaLabel]="column().label" class="flex-1 text-nowrap text-ellipsis overflow-hidden">
    {{ column().label }}
  </div>
  <div class="flex-none">
    <button class="cursor-pointer" hlmBtn variant="ghost" size="icon-xs">
      <ng-icon name="lucideSortAsc"></ng-icon>
    </button>
    @if (selectedOptions().size > 0) {
      <button class="cursor-pointer" hlmBtn variant="ghost" size="icon-xs">
        <ng-icon name="lucideFilterX"></ng-icon>
      </button>
    }
  </div>
</div>
<!-- Resize handle -->
<div
  class="absolute top-0 right-0 w-1 h-full cursor-col-resize hover:bg-primary/50 active:bg-primary"
  (mousedown)="onResizeStart($event)"
></div>
<ng-template #menu>
  <hlm-dropdown-menu class="w-56">
    <!---Sort Options -->
    <hlm-dropdown-menu-label>Sort</hlm-dropdown-menu-label>
    <hlm-dropdown-menu-group>
      <button hlmDropdownMenuItem>
        <span>Ascending</span>
        <hlm-dropdown-menu-shortcut>
          <ng-icon name="lucideSortAsc"></ng-icon>
        </hlm-dropdown-menu-shortcut>
      </button>

      <button hlmDropdownMenuItem>
        <span>Descending</span>
        <hlm-dropdown-menu-shortcut>
          <ng-icon name="lucideSortDesc"></ng-icon>
        </hlm-dropdown-menu-shortcut>
      </button>
    </hlm-dropdown-menu-group>

    <hlm-dropdown-menu-separator />

    <hlm-dropdown-menu-group>
      <hlm-dropdown-menu-label>
        Filters
        <hlm-dropdown-menu-shortcut>
          ({{ selectedOptions().size }} selected)
        </hlm-dropdown-menu-shortcut>
      </hlm-dropdown-menu-label>
      <button
        hlmDropdownMenuItem
        [variant]="'destructive'"
        [disabled]="selectedOptions().size === 0"
      >
        Clear All
        <hlm-dropdown-menu-shortcut>
          <ng-icon class="text-red-500" name="lucideTrash"></ng-icon>
        </hlm-dropdown-menu-shortcut>
      </button>
      <!-- Lightweight virtual scroll (no nested cdk-virtual-scroll-viewport) -->
      <div
        class="relative overflow-y-auto"
        style="height: 256px"
        (scroll)="onOptionsScroll($event)"
      >
        <div [style.height.px]="totalHeight()" class="relative">
          @for (entry of visibleOptions(); track entry.index) {
            <div
              class="absolute left-0 right-0"
              [style.top.px]="entry.offsetTop"
              [style.height.px]="optionHeight"
            >
              @if (entry.option) {
                <button
                  hlmDropdownMenuCheckbox
                  [checked]="selectedOptions().has(entry.option)"
                  (triggered)="toggleOption(entry.option)"
                >
                  <hlm-dropdown-menu-checkbox-indicator />
                  <span class="text-nowrap text-ellipsis overflow-hidden">{{ entry.option }}</span>
                </button>
              } @else {
                <div class="h-full flex items-center justify-center">
                  <hlm-skeleton class="h-4 w-full" />
                </div>
              }
            </div>
          }
        </div>
      </div>
    </hlm-dropdown-menu-group>
  </hlm-dropdown-menu>
</ng-template>
