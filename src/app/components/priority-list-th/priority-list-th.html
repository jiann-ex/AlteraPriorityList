<div class="group flex justify-between items-center w-full">
  <div [ariaLabel]="column().label" class="flex-1 text-nowrap text-ellipsis overflow-hidden">
    {{ column().label }}
  </div>
  <div class="flex-none flex items-center gap-2">
    <button
      class="cursor-pointer"
      [ngClass]="{
        'hidden group-hover:flex': sortColumn() !== column().key,
      }"
      hlmBtn
      variant="outline"
      size="icon-xs"
      (click)="toggleSort($event)"
    >
      <ng-icon
        [name]="
          !sortDirection()
            ? 'lucideSortAsc'
            : sortDirection() === 'asc'
              ? 'lucideSortAsc'
              : 'lucideSortDesc'
        "
      ></ng-icon>
    </button>
    @if (hasActiveFilter()) {
      <button
        class="cursor-pointer"
        hlmBtn
        variant="destructive"
        size="icon-xs"
        (click)="clearFilter($event)"
      >
        <ng-icon name="lucideFilterX"></ng-icon>
      </button>
    }
  </div>
</div>
<!-- Resize handle -->
<div
  class="absolute top-0 right-0 w-1 h-full cursor-col-resize hover:bg-primary/50 active:bg-primary"
  (mousedown)="onResizeStart($event)"
></div>
<ng-template #menu>
  <hlm-dropdown-menu class="w-56">
    <!---Sort Options -->
    <hlm-dropdown-menu-label>Sort</hlm-dropdown-menu-label>
    <hlm-dropdown-menu-group>
      <button hlmDropdownMenuItem (triggered)="manualSort('asc')">
        <ng-icon name="lucideSortAsc"></ng-icon>
        <span>Ascending</span>
      </button>
      <button hlmDropdownMenuItem (triggered)="manualSort('desc')">
        <ng-icon name="lucideSortDesc"></ng-icon>
        <span>Descending</span>
      </button>
      <button hlmDropdownMenuItem variant="destructive" (triggered)="manualSort(null)">
        <ng-icon name="lucideX"></ng-icon>
        <span>Clear Sort</span>
      </button>
    </hlm-dropdown-menu-group>

    <hlm-dropdown-menu-separator />

    <hlm-dropdown-menu-group>
      <hlm-dropdown-menu-label>
        Filters
        @if (!isSearchOnly()) {
          <hlm-dropdown-menu-shortcut>
            ({{ selectedOptions().size }} selected)
          </hlm-dropdown-menu-shortcut>
        }
      </hlm-dropdown-menu-label>
      @if (!isSearchOnly()) {
        <button
          hlmDropdownMenuItem
          [variant]="'destructive'"
          [disabled]="selectedOptions().size === 0"
          (triggered)="clearSelect()"
        >
          Clear All
          <hlm-dropdown-menu-shortcut>
            <ng-icon class="text-red-500" name="lucideTrash"></ng-icon>
          </hlm-dropdown-menu-shortcut>
        </button>
      }
      <button hlmDropdownMenuItem (triggered)="applyFilter()">
        <ng-icon name="lucideCheckCheck"></ng-icon>
        <span>Apply</span>
      </button>
      <div class="my-1">
        <input
          hlmInput
          [placeholder]="isSearchOnly() ? 'Search term' : 'Search options'"
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchInput($event)"
          (keydown)="$event.stopPropagation()"
        />
      </div>
      @if (!isSearchOnly()) {
        <button hlmDropdownMenuCheckbox keepOpen [checked]="blank()" (triggered)="toggleBlank()">
          <hlm-dropdown-menu-checkbox-indicator />
          <span class="text-nowrap text-ellipsis overflow-hidden">BLANK</span>
        </button>
        @if (dataSource.isEmpty$ | async) {
          <div class="p-4 text-center text-sm text-muted-foreground">No options found</div>
        }
        <cdk-virtual-scroll-viewport
          [style.height.px]="viewportHeight()"
          [itemSize]="32"
          [minBufferPx]="320"
          [maxBufferPx]="620"
          (focusout)="$event.stopPropagation()"
        >
          <ng-container *cdkVirtualFor="let option of dataSource">
            @if (option) {
              <button
                hlmDropdownMenuCheckbox
                keepOpen
                [checked]="selectedOptions().has(option)"
                (triggered)="toggleOption(option)"
              >
                <hlm-dropdown-menu-checkbox-indicator />
                <span class="text-nowrap text-ellipsis overflow-hidden">{{ option }}</span>
              </button>
            } @else {
              <div class="h-8 px-2">
                <hlm-skeleton class="h-6 w-full" />
              </div>
            }
          </ng-container>
        </cdk-virtual-scroll-viewport>
      }
      <!-- Lightweight virtual scroll (no nested cdk-virtual-scroll-viewport) -->
      <!-- <div

  </hlm-dropdown-menu>
</ng-template>
