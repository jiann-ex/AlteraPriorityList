<!-- Filter row -->
<div class="flex flex-wrap gap-2 p-2">
  @for (col of columns; track col.key) {
    <input
      class="border-input bg-background text-foreground placeholder:text-muted-foreground rounded-md border px-2 py-1 text-sm"
      [placeholder]="'Filter ' + col.label"
      [ngModel]="filters[col.key] ?? ''"
      (ngModelChange)="filters[col.key] = $event; onFilterChange()"
    />
  }
</div>

<!-- Status bar -->
<div class="text-muted-foreground flex items-center gap-2 px-2 py-1 text-xs">
  <span>{{ totalCount() }} rows</span>
  @if (isLoading()) {
    <hlm-spinner size="sm" />
  }
</div>

<!-- Virtual scroll table -->
<cdk-virtual-scroll-viewport
  #tableViewport
  class="h-[600px] overflow-auto rounded-md border"
  [itemSize]="40"
  [minBufferPx]="400"
  [maxBufferPx]="800"
>
  <table hlmTable class="w-full">
    <thead hlmTableHeader class="sticky top-0 z-10 bg-background">
      <tr hlmTableRow>
        @for (col of columns; track col.key) {
          <th
            hlmTableHead
            [class]="col.class ?? ''"
            class="cursor-pointer select-none"
            (click)="onSort(col.key)"
          >
            {{ col.label }}
            <span class="ml-1 text-xs opacity-60">{{ getSortIcon(col.key) }}</span>
          </th>
        }
      </tr>
    </thead>

    <tbody hlmTableBody>
      <tr hlmTableRow class="h-[40px]" *cdkVirtualFor="let item of dataSource">
        @for (col of columns; track col.key) {
          <td hlmTableCell [class]="col.class ?? ''">
            {{ getCellValue(item, col.key) }}
          </td>
        }
      </tr>
    </tbody>
  </table>
</cdk-virtual-scroll-viewport>
