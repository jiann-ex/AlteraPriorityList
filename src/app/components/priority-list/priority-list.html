<cdk-virtual-scroll-viewport
  class="h-[100px]"
  [itemSize]="48"
  [maxBufferPx]="1200"
  [minBufferPx]="400"
>
  <div class="h-[48px]" *cdkVirtualFor="let priority of priorities()">{{ priority.id }}</div>
</cdk-virtual-scroll-viewport>

<cdk-virtual-scroll-viewport
  class="h-[100px]"
  [itemSize]="48"
  [maxBufferPx]="1200"
  [minBufferPx]="400"
>
  <div hlmTableContainer>
    <table hlmTable>
      <thead hlmTableHeader>
        <tr hlmTableRow>
          <th hlmTableHead class="w-25">Invoice</th>
          <th hlmTableHead>Status</th>
          <th hlmTableHead>Method</th>
          <th hlmTableHead class="text-right">Amount</th>
        </tr>
      </thead>

      <tbody hlmTableBody>
        <!-- @for (priority of priorities(); track priority.id) {

        } -->
        <tr hlmTableRow *cdkVirtualFor="let priority of priorities()">
          <td hlmTableCell class="font-medium">{{ priority.id }}</td>
          <td hlmTableCell>{{ priority.priority }}</td>
          <td hlmTableCell>{{ priority.r1 }}</td>
          <td hlmTableCell class="text-right">{{ priority.r2 }}</td>
        </tr>
      </tbody>

      <tfoot hlmTableFooter>
        <tr hlmTableRow>
          <td hlmTableCell [attr.colSpan]="3">Total</td>
          <td hlmTableCell class="text-right">xxx Priorities</td>
        </tr>
      </tfoot>
    </table>
  </div>
</cdk-virtual-scroll-viewport>
